
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Listes</title>
    <link rel="stylesheet" href="style.css?v=0.4">
</head>

<body>
    <main class="application">

        <header class="entete">
            <div class="logo">✓</div>
            <div>
                <h1>Mes Listes</h1>
                <p>Mon organisation au quotidien</p>
            </div>
        </header>

        <nav class="navigation" aria-label="Navigation principale">
            <button id="onglet-taches"
                    class="onglet actif"
                    type="button"
                    aria-pressed="true">
                ☑ Tâches
            </button>

            <button id="onglet-courses"
                    class="onglet"
                    type="button"
                    aria-pressed="false">
                🛒 Courses
            </button>
        </nav>

        <section id="section-taches">
            <h2>Mes tâches</h2>

            <div class="ajout-tache">
                <input id="nouvelle-tache"
                       type="text"
                       placeholder="Nouvelle tâche...">

                <button id="bouton-ajouter"
                        type="button"
                        aria-label="Ajouter une tâche">
                    +
                </button>
            </div>

            <ul id="liste-taches"></ul>
        </section>

        <section id="section-courses" hidden>
            <h2>Mes courses</h2>
            <p>Notre prochaine fonctionnalité arrive bientôt ! 🛒</p>
        </section>

    </main>

    <script src="script.js?v=0.4"></script>
</body>
</html>
