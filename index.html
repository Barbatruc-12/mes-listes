<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Listes</title>
</head>

<body>

    <h1>Mes Listes</h1>

    <p>Ma première application ! 🎉</p>

    <h2>Mes tâches</h2>

    <input id="nouvelle-tache" type="text" placeholder="Ajouter une tâche...">
<button id="bouton-ajouter">Ajouter</button>

<ul id="liste-taches"></ul>
    
<script>
    const champTache = document.getElementById("nouvelle-tache");
    const boutonAjouter = document.getElementById("bouton-ajouter");
    const listeTaches = document.getElementById("liste-taches");

    boutonAjouter.addEventListener("click", function() {

        const texteTache = champTache.value;

        if (texteTache !== "") {
            const nouvelleTache = document.createElement("li");
            nouvelleTache.textContent = texteTache;

            listeTaches.appendChild(nouvelleTache);

            champTache.value = "";
        }

    });
</script>
</body>
</html>
