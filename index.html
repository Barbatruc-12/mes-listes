
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Listes</title>
    <link rel="stylesheet" href="style.css?v=0.8.1">
</head>

<body>
    <main class="application">

        <header class="entete">
            <div class="logo">✓</div>
            <div>
                <h1>Mes Listes</h1>
                <p>Mon organisation au quotidien</p>
            </div>
        </header>

        <nav class="navigation" aria-label="Navigation principale">
            <button id="onglet-taches"
                    class="onglet actif"
                    type="button"
                    aria-pressed="true">
                ☑ Tâches
            </button>

<button id="onglet-besoins"
        class="onglet"
        type="button"
        aria-pressed="false">
    📋 Besoins
</button>
            
            <button id="onglet-courses"
                    class="onglet"
                    type="button"
                    aria-pressed="false">
                🛒 Courses
            </button>
        </nav>

        <section id="section-taches">
            <h2>Mes tâches</h2>

            <div class="ajout-tache">
                <input id="nouvelle-tache"
                       type="text"
                       placeholder="Nouvelle tâche...">

                <button id="bouton-ajouter"
                        type="button"
                        aria-label="Ajouter une tâche">
                    +
                </button>
            </div>

            <ul id="liste-taches"></ul>
        </section>

        
<section id="section-besoins" hidden>

    <h2>Mes besoins</h2>

    <div class="ajout-besoin">
        <input id="nouveau-besoin"
               type="text"
               placeholder="De quoi ai-je besoin ?"
               maxlength="100">

        <button id="bouton-ajouter-besoin"
                type="button"
                aria-label="Ajouter un besoin">
            +
        </button>
    </div>

    <p id="message-besoins-vides" hidden>
        Aucun besoin enregistré.
    </p>

    <ul id="liste-besoins"></ul>

</section>

       
<section id="section-courses" hidden>

    <h2>Mes listes</h2>

    <div class="creation-liste">
        <input
            id="nom-nouvelle-liste"
            type="text"
            placeholder="Nom de la nouvelle liste..."
            maxlength="60"
        >

        <button id="bouton-creer-liste"
                type="button"
                aria-label="Créer une liste">
            +
        </button>
    </div>

    <div id="conteneur-listes"></div>


<div id="detail-liste" hidden>

    <button id="retour-listes" type="button">
        ← Retour aux listes
    </button>

    <div class="entete-liste">
        <h2 id="titre-liste"></h2>

        <button id="vider-liste"
                type="button"
                title="Vider la liste"
                aria-label="Vider la liste">
            🗑
        </button>
    </div>

    <div class="ajout-article">
        <input id="nouvel-article"
               type="text"
               placeholder="Ajouter un article..."
               maxlength="100">

        <button id="bouton-ajouter-article"
                type="button"
                aria-label="Ajouter un article">
            +
        </button>
    </div>

    <p id="message-liste-vide">
        Aucun article pour le moment.
    </p>

    <ul id="liste-articles"></ul>

</div>


</section>


<!-- Fenêtre de sélection d'une liste de courses -->
<div id="fenetre-destination" class="fond-modal" hidden>

    <div class="modal-destination"
         role="dialog"
         aria-modal="true"
         aria-labelledby="titre-destination">

        <div class="entete-modal">
            <h2 id="titre-destination">
                Choisir une liste
            </h2>

            <button id="fermer-destination"
                    type="button"
                    aria-label="Fermer">
                ✕
            </button>
        </div>

        <p id="texte-destination"></p>

        <div id="choix-destinations"></div>

    </div>

</div>

        
    </main>

    <script src="script.js?v=0.8.1"></script>
</body>
</html>
